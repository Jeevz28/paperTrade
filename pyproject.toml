[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-paperlab"
version = "0.8.1"
description = "Local-only Indian market research and paper execution"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.14,<2", "httpx>=0.28,<1", "pyarrow>=18,<26", "websockets>=15,<16", "protobuf>=6.33.5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app" = ["schema.sql", "extensions.sql", "release3.sql", "release4.sql", "release5.sql", "release6.sql", "release7.sql", "release8.sql", "MarketDataFeed.proto"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
